<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    />
    <title>VJ1</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" />
    <link rel="stylesheet" type="text/css" href="js/libraries/ui-engine/base.css?v=ui-engine-53" />
    <link rel="stylesheet" type="text/css" href="style.css?v=ui-engine-53" />
    <link rel="stylesheet" type="text/css" href="js/libraries/ui-engine/themes/vj.css?v=ui-engine-53" />
  </head>
  <body data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false">
    <main id="app" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false"></main>
    <script>
      (async () => {
        const sourceRevision = "source-coherence-274";
        const { createVj1StartupUi } = await import(`./js/startup.js?v=${sourceRevision}`);
        const startupUi = createVj1StartupUi();
        const workerUrl = new URL(`./module-source-worker.js?v=${sourceRevision}`, location.href).href;
        const start = async () => {
          startupUi.update({ state: "loading", title: "VJ1", message: "Starting application…" });
          const application = await import("./js/app.js");
          return application.startVj1App({ startupUi });
        };
        if (!("serviceWorker" in navigator) || !window.isSecureContext) {
          await start();
          return;
        }
        try {
          const registration = await navigator.serviceWorker.register(
            workerUrl,
            { scope: "./", updateViaCache: "none" },
          );
          const controllerMatches = () =>
            navigator.serviceWorker.controller?.scriptURL === workerUrl;
          if (controllerMatches()) {
            sessionStorage.removeItem(`vj1-source-worker:${sourceRevision}`);
            registration.update().catch((error) => {
              console.warn("[VJ1_SOURCE_COHERENCE_REFRESH_FAILED]", error);
            });
          } else {
            startupUi.update({ state: "loading", title: "VJ1", message: "Updating application sources…" });
            await Promise.race([
              Promise.all([
                registration.update(),
                navigator.serviceWorker.ready,
              ]),
              new Promise((resolve) => setTimeout(resolve, 4000)),
            ]);
            await Promise.race([
              new Promise((resolve) => {
                const changed = () => {
                  if (!controllerMatches()) return;
                  navigator.serviceWorker.removeEventListener("controllerchange", changed);
                  resolve();
                };
                navigator.serviceWorker.addEventListener("controllerchange", changed);
              }),
              new Promise((resolve) => setTimeout(resolve, 4000)),
            ]);
            if (!controllerMatches()) {
              const reloadKey = `vj1-source-worker:${sourceRevision}`;
              if (sessionStorage.getItem(reloadKey) !== "ready") {
                sessionStorage.setItem(reloadKey, "ready");
                location.reload();
                return;
              }
              throw new Error("VJ1_SOURCE_WORKER_REVISION_MISMATCH");
            }
            sessionStorage.removeItem(`vj1-source-worker:${sourceRevision}`);
          }
        } catch (error) {
          if (error?.message === "VJ1_SOURCE_WORKER_REVISION_MISMATCH") {
            console.error("[VJ1_SOURCE_COHERENCE_BLOCKED]", error);
            startupUi.update({
              state: "error",
              title: "VJ1 could not start",
              message: "Application sources could not be updated.",
              detail: "Reload the page to retry source synchronization.",
            });
            return;
          }
          console.warn("[VJ1_SOURCE_COHERENCE_UNAVAILABLE]", error);
        }
        await start();
      })();
    </script>
  </body>
</html>
