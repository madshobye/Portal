<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style><script src="https://cdn.jsdelivr.net/npm/p5@2.2.0/lib/p5.js"></script></head>
<body><script type="module">
import { getGeneratorShaderComponent } from "../js/shaders/generator-shaders.js?v=shadertoy-generator-15";
import { createShaderBuilder } from "../js/shaders/shader-builder.js?v=shadertoy-generator-15";
new p5((s) => {
  s.setup = () => {
    const g = s.createCanvas(800, 450, s.WEBGL);
    const component = getGeneratorShaderComponent("cloudyTunnel");
    const shader = createShaderBuilder({ getCustomCode: () => "" }).getShader({ id: component.id, component }, s);
    s.shader(shader);
    shader.setUniform("iResolution", [s.drawingContext.drawingBufferWidth, s.drawingContext.drawingBufferHeight, 1]);
    shader.setUniform("iTime", 1);
    shader.setUniform("raySteps", 72);
    shader.setUniform("cloudDensity", 0.8);
    shader.setUniform("cloudScale", 1);
    shader.setUniform("cloudDetail", 2);
    shader.setUniform("tunnelRadius", 4.4);
    shader.setUniform("tunnelSpread", 3.7);
    shader.setUniform("pathBend", 6.2);
    shader.setUniform("pathFrequency", 0.33);
    shader.setUniform("cameraSway", 1);
    shader.setUniform("fieldOfView", 3);
    shader.setUniform("fogStrength", 0.001);
    shader.setUniform("vignette", 1);
    shader.setUniform("tunnelColor", [0, 0.15, 0.32, 1]);
    shader.setUniform("fogColor", [0, 0.15, 0.52, 1]);
    shader.setUniform("amount", 1);
    s.rect(-400, -225, 800, 450);
    s.noLoop();
  };
});
</script></body></html>
