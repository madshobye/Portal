<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VJ1 Persistent ISF Smoke</title>
  </head>
  <body>
    <pre id="persistent-isf-results">initializing...</pre>
    <script src="https://cdn.jsdelivr.net/npm/p5@2.2.0/lib/p5.js"></script>
    <script type="module">
      import { createIsfVisualComponent } from "../../js/libraries/isf-engine/index.js";
      import { IsfRenderRuntime } from "../../js/output/isf-render-runtime.js";
      import { ShaderEffectRuntime } from "../../js/output/shader-effect-runtime.js";
      import {
        createSharedFramebufferTarget,
        unwrapRenderTarget,
      } from "../../js/output/shared-framebuffer-target.js";
      import { createShaderBuilder } from "../../js/shaders/shader-builder.js";

      const resultElement = document.querySelector("#persistent-isf-results");
      function reportFailure(error) {
        resultElement.textContent = JSON.stringify({ ok: false, error }, null, 2);
        document.documentElement.dataset.status = "error";
      }

      async function installSmoke() {
        const posterizeSource = await fetch(
        "../../visual-library/shaders/isf/effects/posterize.fs",
      ).then((response) => {
        if (!response.ok) throw new Error(`POSTERIZE_SOURCE_${response.status}`);
        return response.text();
      });
      const [
        randomFreezeSource,
        cometTailsSource,
        ghostingSource,
        dilateSource,
        erodeSource,
        fftColorLinesSource,
        fftFilledWaveformSource,
        waveformDisplaceSource,
        shockwavePulseSource,
        fftSpectrogramSource,
        cursorSource,
        cursorOverlaySource,
        dotScreenSource,
        dotScreenVertexSource,
      ] = await Promise.all([
        fetch("./fixtures/random-freeze.fs").then((response) => {
          if (!response.ok) {
            throw new Error(`RANDOM_FREEZE_SOURCE_${response.status}`);
          }
          return response.text();
        }),
        fetch("./fixtures/comet-tails.fs").then((response) => {
          if (!response.ok) {
            throw new Error(`COMET_TAILS_SOURCE_${response.status}`);
          }
          return response.text();
        }),
        fetch("../../visual-library/shaders/isf/effects/ghosting.fs").then((response) => {
          if (!response.ok) {
            throw new Error(`GHOSTING_SOURCE_${response.status}`);
          }
          return response.text();
        }),
        ...["dilate", "erode"].map((name) =>
          fetch(`../../visual-library/shaders/isf/effects/${name}.fs`).then(
            (response) => {
              if (!response.ok) {
                throw new Error(
                  `MULTIPASS_COMPARISON_SOURCE_${name}_${response.status}`,
                );
              }
              return response.text();
            },
          )
        ),
        fetch("../../visual-library/shaders/isf/generators/fft-color-lines.fs").then(
          (response) => {
            if (!response.ok) throw new Error(`FFT_COLOR_LINES_SOURCE_${response.status}`);
            return response.text();
          },
        ),
        fetch("../../visual-library/shaders/isf/generators/fft-filled-waveform.fs").then(
          (response) => {
            if (!response.ok) throw new Error(`FFT_FILLED_WAVEFORM_SOURCE_${response.status}`);
            return response.text();
          },
        ),
        fetch("../../visual-library/shaders/isf/effects/waveform-displace.fs").then(
          (response) => {
            if (!response.ok) throw new Error(`WAVEFORM_DISPLACE_SOURCE_${response.status}`);
            return response.text();
          },
        ),
        fetch("../../visual-library/shaders/isf/effects/shockwave-pulse.fs").then(
          (response) => {
            if (!response.ok) throw new Error(`SHOCKWAVE_PULSE_SOURCE_${response.status}`);
            return response.text();
          },
        ),
        fetch("../../visual-library/shaders/isf/generators/fft-spectrogram.fs").then(
          (response) => {
            if (!response.ok) throw new Error(`FFT_SPECTROGRAM_SOURCE_${response.status}`);
            return response.text();
          },
        ),
        fetch("../../visual-library/shaders/isf/generators/cursor.fs").then(
          (response) => {
            if (!response.ok) throw new Error(`CURSOR_SOURCE_${response.status}`);
            return response.text();
          },
        ),
        fetch("../../visual-library/shaders/isf/effects/cursor-overlay.fs").then(
          (response) => {
            if (!response.ok) throw new Error(`CURSOR_OVERLAY_SOURCE_${response.status}`);
            return response.text();
          },
        ),
        fetch("../../visual-library/shaders/isf/effects/dot-screen.fs").then(
          (response) => {
            if (!response.ok) throw new Error(`DOT_SCREEN_SOURCE_${response.status}`);
            return response.text();
          },
        ),
        fetch("../../visual-library/shaders/isf/effects/dot-screen.vs").then(
          (response) => {
            if (!response.ok) throw new Error(`DOT_SCREEN_VERTEX_SOURCE_${response.status}`);
            return response.text();
          },
        ),
      ]);
      const resources = [];
      const identity = [
        1, 0, 0,
        0, 1, 0,
        0, 0, 1,
      ];

      window.addEventListener("error", (event) => reportFailure(
        event.error?.stack || event.message || "PERSISTENT_ISF_SMOKE_SCRIPT_ERROR",
      ));
      window.addEventListener("unhandledrejection", (event) => reportFailure(
        event.reason?.stack || event.reason?.message ||
          String(event.reason || "PERSISTENT_ISF_SMOKE_REJECTION"),
      ));

      function solid(target, color) {
        target.push();
        target.clear();
        target.noStroke();
        target.background(...color);
        target.pop();
      }

      function centerPixel(target) {
        const image = target.get();
        resources.push(image);
        image.loadPixels();
        const x = Math.floor(image.width / 2);
        const y = Math.floor(image.height / 2);
        const offset = (y * image.width + x) * 4;
        return Array.from(image.pixels.slice(offset, offset + 4));
      }

      function sampledCenterPixel(target) {
        return sampledPixel(target, 0.5, 0.5);
      }

      function sampledPixel(target, xRatio, yRatio) {
        const capture = createSharedFramebufferTarget(target.width, target.height);
        resources.push(capture);
        capture.push();
        capture.clear();
        capture.image(target, 0, 0, target.width, target.height);
        capture.pop();
        const image = capture.get();
        resources.push(image);
        image.loadPixels();
        const x = Math.min(
          image.width - 1,
          Math.max(0, Math.floor(image.width * xRatio)),
        );
        const y = Math.min(
          image.height - 1,
          Math.max(0, Math.floor(image.height * yRatio)),
        );
        const offset = (y * image.width + x) * 4;
        return Array.from(image.pixels.slice(offset, offset + 4));
      }

      function pixelData(target) {
        const image = target.get();
        resources.push(image);
        image.loadPixels();
        return Array.from(image.pixels);
      }

      globalThis.setup = () => {
        try {
          createCanvas(16, 16, WEBGL);
          pixelDensity(1);
          noLoop();
          const component = createIsfVisualComponent({
            path: "tests/persistent-history.fs",
            source: `/*{
              "ISFVSN": "2",
              "VJ1": { "PROFILE": "vj1-isf-webgl2@1" },
              "INPUTS": [
                { "NAME": "inputImage", "TYPE": "image" }
              ],
              "PASSES": [
                {
                  "TARGET": "history",
                  "PERSISTENT": true,
                  "FLOAT": true
                }
              ]
            }*/
            void main() {
              vec4 fresh = IMG_THIS_PIXEL(inputImage);
              vec4 stale = IMG_THIS_PIXEL(history);
              isf_FragColor = FRAMEINDEX == 0
                ? fresh
                : mix(fresh, stale, 0.5);
            }`,
          });
          const posterize = createIsfVisualComponent({
            path: "visual-library/shaders/isf/effects/posterize.fs",
            source: posterizeSource,
          });
          const randomFreeze = createIsfVisualComponent({
            path: "tests/browser/fixtures/random-freeze.fs",
            source: randomFreezeSource,
          });
          const cometTails = createIsfVisualComponent({
            path: "tests/browser/fixtures/comet-tails.fs",
            source: cometTailsSource,
          });
          const ghosting = createIsfVisualComponent({
            path: "visual-library/shaders/isf/effects/ghosting.fs",
            source: ghostingSource,
          });
          const multipassComparisons = [
            ["dilate", dilateSource],
            ["erode", erodeSource],
          ].map(([name, source]) => createIsfVisualComponent({
            path: `visual-library/shaders/isf/effects/${name}.fs`,
            source,
          }));
          const fftColorLines = createIsfVisualComponent({
            path: "visual-library/shaders/isf/generators/fft-color-lines.fs",
            source: fftColorLinesSource,
          });
          const fftFilledWaveform = createIsfVisualComponent({
            path: "visual-library/shaders/isf/generators/fft-filled-waveform.fs",
            source: fftFilledWaveformSource,
          });
          const waveformDisplace = createIsfVisualComponent({
            path: "visual-library/shaders/isf/effects/waveform-displace.fs",
            source: waveformDisplaceSource,
          });
          const shockwavePulse = createIsfVisualComponent({
            path: "visual-library/shaders/isf/effects/shockwave-pulse.fs",
            source: shockwavePulseSource,
          });
          const fftSpectrogram = createIsfVisualComponent({
            path: "visual-library/shaders/isf/generators/fft-spectrogram.fs",
            source: fftSpectrogramSource,
          });
          const importedResourceDescriptor = Object.freeze({
            id: "smoke/cursor.png",
            url: "smoke://cursor.png",
          });
          const cursor = Object.freeze({
            ...createIsfVisualComponent({
              path: "visual-library/shaders/isf/generators/cursor.fs",
              source: cursorSource,
            }),
            isfImportedResources: Object.freeze({
              cursorImage: importedResourceDescriptor,
            }),
          });
          const cursorOverlay = Object.freeze({
            ...createIsfVisualComponent({
              path: "visual-library/shaders/isf/effects/cursor-overlay.fs",
              source: cursorOverlaySource,
            }),
            isfImportedResources: Object.freeze({
              cursorImage: importedResourceDescriptor,
            }),
          });
          const dotScreen = createIsfVisualComponent({
            path: "visual-library/shaders/isf/effects/dot-screen.fs",
            source: dotScreenSource,
            vertexPath: "visual-library/shaders/isf/effects/dot-screen.vs",
            vertexSource: dotScreenVertexSource,
          });
          const eventProbe = createIsfVisualComponent({
            path: "tests/browser/event-pulse.fs",
            source: `/*{
              "ISFVSN": "2",
              "VJ1": { "PROFILE": "vj1-isf-webgl2@1" },
              "INPUTS": [
                { "NAME": "trigger", "TYPE": "event" }
              ]
            }*/
            void main() {
              isf_FragColor = trigger
                ? vec4(1.0, 1.0, 1.0, 1.0)
                : vec4(0.0, 0.0, 0.0, 1.0);
            }`,
          });
          const eventEffectProbe = createIsfVisualComponent({
            path: "tests/browser/event-effect-pulse.fs",
            source: `/*{
              "ISFVSN": "2",
              "VJ1": { "PROFILE": "vj1-isf-webgl2@1" },
              "INPUTS": [
                { "NAME": "inputImage", "TYPE": "image" },
                { "NAME": "trigger", "TYPE": "event" }
              ]
            }*/
            void main() {
              isf_FragColor = trigger
                ? vec4(1.0, 1.0, 1.0, 1.0)
                : vec4(0.0, 0.0, 0.0, 1.0);
            }`,
          });
          const input = createSharedFramebufferTarget(8, 8);
          const finalTarget = createSharedFramebufferTarget(8, 8);
          resources.push(input, finalTarget);
          const frameRuntime = {
            frameIndex: 20,
            visualTime: 0,
            visualDeltaSeconds: 1 / 60,
            isPlaybackActive: () => true,
            scheduledEvents: [],
          };
          const audioFrame = {
            sequence: 1,
            lifecycleRevision: 1,
            timeData: new Uint8Array(1024).fill(128),
            frequencyData: new Uint8Array(512),
          };
          const host = {
            frameRuntime,
            controlSignalRuntime: {
              analysisFrame: () => audioFrame,
            },
            renderTargetRuntime: {
              isShaderBuffer: (target) => !!target?.__vj1SharedFramebuffer,
            },
            shaderEffectRuntime: {
              measurePass: (_pass, _component, _request, _meta, _target, draw) => draw(),
              setInfrastructureUniforms: (shader) => {
                shader.setUniform("effectUvMatrix", identity);
                shader.setUniform("inverseEffectUvMatrix", identity);
              },
            },
          };
          let runtime = null;
          runtime = new IsfRenderRuntime(host, {
            setShaderParams: (shader, component, params = {}, options = {}) => {
              for (const [name, value] of Object.entries(params)) {
                if (shader.uniforms?.[name]) shader.setUniform(name, value);
              }
              for (const param of component.params || []) {
                if (
                  param.isfUniformType === "event" &&
                  shader.uniforms?.[param.id]
                ) {
                  shader.setUniform(
                    param.id,
                    runtime.eventPulse(
                      options.instanceId,
                      param.id,
                      params[param.id],
                    ),
                  );
                }
              }
              if (shader.uniforms?.amount) shader.setUniform("amount", 1);
              if (shader.uniforms?.renderQuality) {
                shader.setUniform("renderQuality", 0.5);
              }
            },
          });
          const components = new Map([
            [component.id, component],
            [posterize.id, posterize],
            [randomFreeze.id, randomFreeze],
            [cometTails.id, cometTails],
            [ghosting.id, ghosting],
            [fftColorLines.id, fftColorLines],
            [fftFilledWaveform.id, fftFilledWaveform],
            [waveformDisplace.id, waveformDisplace],
            [shockwavePulse.id, shockwavePulse],
            [fftSpectrogram.id, fftSpectrogram],
            [cursor.id, cursor],
            [cursorOverlay.id, cursorOverlay],
            [dotScreen.id, dotScreen],
            [eventProbe.id, eventProbe],
            [eventEffectProbe.id, eventEffectProbe],
            ...multipassComparisons.map((entry) => [entry.id, entry]),
          ]);
          const builder = createShaderBuilder({
            getComponent: (id) => components.get(id) || null,
            getCustomCode: () => "",
          });
          const shader = builder.getShader({
            id: component.id,
            component,
          }, finalTarget);
          if (!shader) throw new Error("PERSISTENT_ISF_SHADER_UNAVAILABLE");
          const renderRequest = {
            width: 8,
            height: 8,
            logicalWidth: 8,
            logicalHeight: 8,
            uvRect: [0, 0, 1, 1],
          };
          const orientationInput = createSharedFramebufferTarget(8, 8);
          const orientationTarget = createSharedFramebufferTarget(8, 8);
          resources.push(orientationInput, orientationTarget);
          orientationInput.push();
          orientationInput.clear();
          orientationInput.noStroke();
          orientationInput.fill(255, 0, 0, 255);
          orientationInput.rect(0, 0, 8, 4);
          orientationInput.fill(0, 0, 255, 255);
          orientationInput.rect(0, 4, 8, 4);
          orientationInput.pop();
          const posterizeShader = builder.getShader({
            id: posterize.id,
            component: posterize,
          }, orientationTarget);
          if (!posterizeShader) {
            throw new Error("POSTERIZE_SHADER_UNAVAILABLE");
          }
          const posterized = runtime.renderProgram({
            component: posterize,
            shader: posterizeShader,
            input: orientationInput,
            finalTarget: orientationTarget,
            renderRequest,
            timeSeconds: 0,
            params: { amount: 1, gamma: 1, numColors: 8 },
            instanceId: "posterize-orientation-smoke",
            effectTransform: {},
          });
          const posterizeTopPixel = sampledPixel(posterized, 0.5, 0.25);
          const posterizeBottomPixel = sampledPixel(posterized, 0.5, 0.75);
          const posterizeKeepsOrientation =
            posterizeTopPixel[0] >= 245 &&
            posterizeTopPixel[2] <= 10 &&
            posterizeBottomPixel[0] <= 10 &&
            posterizeBottomPixel[2] >= 245;

          const dotScreenTarget = createSharedFramebufferTarget(8, 8);
          resources.push(dotScreenTarget);
          const dotScreenRendered = runtime.renderProgram({
            component: dotScreen,
            shader: builder.getShader({
              id: dotScreen.id,
              component: dotScreen,
            }, dotScreenTarget),
            input: orientationInput,
            finalTarget: dotScreenTarget,
            renderRequest,
            timeSeconds: 0,
            params: {
              amount: 1,
              sharpness: 1,
              angle: 0.25,
              scale: 1,
              colorize: 0,
            },
            instanceId: "custom-vertex-dot-screen-smoke",
            effectTransform: {},
          });
          const dotScreenPixels = pixelData(dotScreenRendered);
          const customVertexStageVisible =
            dotScreen.vertexCode.startsWith("#version 300 es") &&
            dotScreenPixels.some((value, index) =>
              index % 4 !== 3 && value > 0
            );

          const cursorTexture = createImage(2, 2);
          resources.push(cursorTexture);
          cursorTexture.loadPixels();
          cursorTexture.pixels.fill(255);
          cursorTexture.updatePixels();
          runtime.importedImages.texture = () => cursorTexture;
          runtime.importedImages.externalKey = () => "smoke/cursor.png:ready:1";
          const cursorTarget = createSharedFramebufferTarget(8, 8);
          const cursorOverlayInput = createSharedFramebufferTarget(8, 8);
          const cursorOverlayTarget = createSharedFramebufferTarget(8, 8);
          resources.push(
            cursorTarget,
            cursorOverlayInput,
            cursorOverlayTarget,
          );
          solid(cursorOverlayInput, [0, 255, 0, 255]);
          const cursorParams = {
            amount: 1,
            cursor_scale: 2,
            cursor_position: [0.5, 0.5],
            bgColor: [0, 0, 0, 1],
          };
          const cursorRendered = runtime.renderProgram({
            component: cursor,
            shader: builder.getShader({
              id: cursor.id,
              component: cursor,
            }, cursorTarget),
            finalTarget: cursorTarget,
            renderRequest,
            timeSeconds: 0,
            params: cursorParams,
            instanceId: "cursor-imported-resource-smoke",
          });
          const cursorOverlayRendered = runtime.renderProgram({
            component: cursorOverlay,
            shader: builder.getShader({
              id: cursorOverlay.id,
              component: cursorOverlay,
            }, cursorOverlayTarget),
            input: cursorOverlayInput,
            finalTarget: cursorOverlayTarget,
            renderRequest,
            timeSeconds: 0,
            params: cursorParams,
            instanceId: "cursor-overlay-imported-resource-smoke",
            effectTransform: {},
          });
          const cursorPixels = pixelData(cursorRendered);
          const cursorOverlayPixels = pixelData(cursorOverlayRendered);
          const cursorImportedImageVisible = cursorPixels.some(
            (value, index) => index % 4 !== 3 && value >= 245,
          );
          let cursorOverlayChangedPixels = 0;
          for (let offset = 0; offset < cursorOverlayPixels.length; offset += 4) {
            if (
              cursorOverlayPixels[offset] >= 245 &&
              cursorOverlayPixels[offset + 1] >= 245 &&
              cursorOverlayPixels[offset + 2] >= 245
            ) {
              cursorOverlayChangedPixels++;
            }
          }
          const cursorOverlayImportedImageVisible =
            cursorOverlayChangedPixels > 0;

          const persistentFixtures = new Map();
          const renderPersistentFixture = (fixture, params, instanceId) => {
            const fixtureInput = createSharedFramebufferTarget(8, 8);
            const fixtureTarget = createSharedFramebufferTarget(8, 8);
            resources.push(fixtureInput, fixtureTarget);
            fixtureInput.push();
            fixtureInput.clear();
            fixtureInput.noStroke();
            fixtureInput.fill(255, 0, 0, 255);
            fixtureInput.rect(0, 0, 8, 4);
            fixtureInput.fill(0, 0, 255, 255);
            fixtureInput.rect(0, 4, 8, 4);
            fixtureInput.pop();
            const fixtureShader = builder.getShader({
              id: fixture.id,
              component: fixture,
            }, fixtureTarget);
            if (!fixtureShader) {
              throw new Error(`${instanceId.toUpperCase()}_SHADER_UNAVAILABLE`);
            }
            const rendered = runtime.renderProgram({
              component: fixture,
              shader: fixtureShader,
              input: fixtureInput,
              finalTarget: fixtureTarget,
              renderRequest,
              timeSeconds: 1,
              params: { amount: 1, ...params },
              instanceId,
              effectTransform: {},
            });
            if (!rendered) {
              throw new Error(`${instanceId.toUpperCase()}_RENDER_UNAVAILABLE`);
            }
            persistentFixtures.set(instanceId, {
              fixture,
              input: fixtureInput,
              target: fixtureTarget,
              shader: fixtureShader,
              params: { amount: 1, ...params },
            });
            const top = sampledPixel(rendered, 0.5, 0.25);
            const bottom = sampledPixel(rendered, 0.5, 0.75);
            return {
              top,
              bottom,
              visible:
                top[0] >= 245 &&
                top[2] <= 10 &&
                bottom[0] <= 10 &&
                bottom[2] >= 245,
            };
          };
          const randomFreezeFirstFrame = renderPersistentFixture(
            randomFreeze,
            {
              maxUpdateSize: 0.5,
              maxBlendAmount: 0,
              resetImage: false,
            },
            "random-freeze-smoke",
          );
          const cometTailsFirstFrame = renderPersistentFixture(
            cometTails,
            {
              absorptionRate: 0.5,
              dischargeRate: 0.02,
            },
            "comet-tails-smoke",
          );
          const cometFixture = persistentFixtures.get("comet-tails-smoke");
          solid(cometFixture.input, [0, 0, 0, 255]);
          const cometSecondRendered = runtime.renderProgram({
            component: cometFixture.fixture,
            shader: cometFixture.shader,
            input: cometFixture.input,
            finalTarget: cometFixture.target,
            renderRequest,
            timeSeconds: 2,
            params: cometFixture.params,
            instanceId: "comet-tails-smoke",
            effectTransform: {},
          });
          const cometSecondTop = sampledPixel(
            cometSecondRendered,
            0.5,
            0.25,
          );
          const cometTailsPersistentHistoryVisible =
            cometSecondTop[0] >= 40 &&
            cometSecondTop[1] <= 10 &&
            cometSecondTop[2] <= 10;

          const ghostingInput = createSharedFramebufferTarget(32, 8);
          const ghostingTarget = createSharedFramebufferTarget(32, 8);
          resources.push(ghostingInput, ghostingTarget);
          ghostingInput.push();
          ghostingInput.clear();
          ghostingInput.noStroke();
          ghostingInput.fill(0, 0, 0, 255);
          ghostingInput.rect(0, 0, 32, 8);
          ghostingInput.fill(255, 255, 255, 255);
          ghostingInput.rect(4, 0, 4, 8);
          ghostingInput.pop();
          const ghostingShader = builder.getShader({
            id: ghosting.id,
            component: ghosting,
          }, ghostingTarget);
          if (!ghostingShader) {
            throw new Error("GHOSTING_SHADER_UNAVAILABLE");
          }
          const ghostingRequest = {
            ...renderRequest,
            width: 32,
            logicalWidth: 32,
          };
          const ghosted = runtime.renderProgram({
            component: ghosting,
            shader: ghostingShader,
            input: ghostingInput,
            finalTarget: ghostingTarget,
            renderRequest: ghostingRequest,
            timeSeconds: 1,
            params: {
              amount: 1,
              uBias: -0.5,
              uScale: 0.5,
              uGhosts: 5,
              uGhostDispersal: 0.1,
              uAdditive: true,
              uDirectionX: 0.5,
              uDirectionY: 0.5,
              uLensColor: [0.9, 0.8, 0.7, 1],
            },
            instanceId: "ghosting-smoke",
            effectTransform: {},
          });
          const ghostingPass = runtime.passTargets.get(
            `${ghosting.id}:${ghosting.isf.sourceHash}:ghosting-smoke:downsampleAndThresholdImage`,
          );
          const ghostingIntermediatePixel = sampledPixel(
            ghostingPass.targets[0],
            0.16,
            0.5,
          );
          const ghostingOutputPixels = [0.05, 0.1, 0.2, 0.3, 0.4].map(
            (x) => sampledPixel(ghosted, x, 0.5),
          );
          const ghostingPassVisible =
            ghostingIntermediatePixel[0] >= 55 &&
            ghostingIntermediatePixel[1] >= 55 &&
            ghostingIntermediatePixel[2] >= 55;
          const ghostingDisplacesHighlights =
            ghostingOutputPixels[0][0] >= 100 &&
            ghostingOutputPixels[3][0] <= 10;

          const productionHandoffInput =
            createSharedFramebufferTarget(8, 8);
          resources.push(productionHandoffInput);
          productionHandoffInput.push();
          productionHandoffInput.clear();
          productionHandoffInput.noStroke();
          productionHandoffInput.fill(255, 0, 0, 255);
          productionHandoffInput.rect(0, 0, 8, 4);
          productionHandoffInput.fill(0, 0, 255, 255);
          productionHandoffInput.rect(0, 4, 8, 4);
          productionHandoffInput.pop();
          const productionHost = {
            frameRuntime,
            state: { shaders: { customCode: "" } },
            renderRequestRuntime: {
              normalize: (request) => request,
            },
            renderTargetRuntime: {
              isShaderBuffer: (target) => !!target?.__vj1SharedFramebuffer,
            },
            visualNodeRuntime: {
              resolverOptions: {
                getEffectComponent: (id) => components.get(id) || null,
              },
            },
            componentRenderRuntime: {
              recordResolution() {},
            },
            profileRuntime: {
              frameProfile: {
                shaderChains: 0,
                maxShaderChainLength: 0,
                shaderPasses: 0,
                shaderHandoffs: 0,
                shaderMs: 0,
                passSamples: [],
              },
              collectDetailed: false,
              activeComponentIdentity: () => ({}),
            },
            presentationRuntime: {
              measureGpu: (_target, draw) => draw(),
            },
            renderEvaluationRuntime: {
              evaluate(nodeId, _signature, request, render, _reason, options) {
                const output = createSharedFramebufferTarget(
                  request.width,
                  request.height,
                );
                resources.push(output);
                render(output);
                return {
                  buffer: output,
                  outputVersion: 1,
                  nodeKey: nodeId,
                  instanceInvariant: options.instanceInvariant,
                };
              },
            },
            compositeRuntime: {
              renderLayerNodeState() {
                throw new Error("PRODUCTION_HANDOFF_UNEXPECTED_COMPOSITE");
              },
            },
          };
          let productionIsfRuntime = null;
          const productionEffectRuntime = new ShaderEffectRuntime(
            productionHost,
            {
              getComponent: (id) => components.get(id) || null,
              getCustomCode: () => "",
              getIsfRuntime: () => productionIsfRuntime,
            },
          );
          productionHost.shaderEffectRuntime = productionEffectRuntime;
          productionIsfRuntime = new IsfRenderRuntime(productionHost);
          productionHost.isfRuntime = productionIsfRuntime;
          const productionState = productionEffectRuntime.renderNodeState(
            "random-freeze-production-handoff",
            {
              buffer: productionHandoffInput,
              outputVersion: 1,
              nodeKey: "production-handoff-input",
              instanceInvariant: false,
            },
            {
              id: "random-freeze-production-instance",
              componentId: randomFreeze.id,
              enabled: true,
              opacity: 1,
              blend: "normal",
              params: {
                amount: 1,
                maxUpdateSize: 0.5,
                maxBlendAmount: 0,
                resetImage: false,
              },
            },
            1,
            renderRequest,
          );
          const productionHandoffTop = sampledPixel(
            productionState.buffer,
            0.5,
            0.25,
          );
          const productionHandoffBottom = sampledPixel(
            productionState.buffer,
            0.5,
            0.75,
          );
          const productionHandoffVisible =
            productionHandoffTop[0] >= 245 &&
            productionHandoffTop[2] <= 10 &&
            productionHandoffBottom[0] <= 10 &&
            productionHandoffBottom[2] >= 245;
          const productionGhostingState = productionEffectRuntime.renderNodeState(
            "ghosting-production-handoff",
            {
              buffer: ghostingInput,
              outputVersion: 1,
              nodeKey: "ghosting-production-input",
              instanceInvariant: false,
            },
            {
              id: "ghosting-production-instance",
              componentId: ghosting.id,
              enabled: true,
              opacity: 1,
              blend: "normal",
              params: {
                amount: 1,
                uBias: 0,
                uScale: 2,
                uGhostDispersal: 0.1,
                uAdditive: true,
                uDirectionX: 0,
                uDirectionY: 0,
                uLensColor: "#ffffffff",
              },
            },
            1,
            ghostingRequest,
          );
          const productionGhostingPixels =
            [0.05, 0.1, 0.2, 0.3, 0.4].map(
              (x) => sampledPixel(productionGhostingState.buffer, x, 0.5),
            );
          const productionGhostingVisible =
            productionGhostingPixels[0][0] >= 100 &&
            productionGhostingPixels[3][0] <= 10;
          const renderProductionEventProbe = (token) => {
            const rendered = productionEffectRuntime.renderNodeState(
              "production-event-probe",
              {
                buffer: productionHandoffInput,
                outputVersion: frameRuntime.frameIndex,
                nodeKey: "production-event-input",
                instanceInvariant: false,
              },
              {
                id: "production-event-probe-instance",
                componentId: eventEffectProbe.id,
                enabled: true,
                opacity: 1,
                blend: "normal",
                params: { amount: 1, trigger: token },
              },
              1,
              renderRequest,
            );
            return sampledCenterPixel(rendered.buffer);
          };
          const productionEventBaseline = renderProductionEventProbe(null);
          frameRuntime.frameIndex++;
          const productionEventFirst = renderProductionEventProbe(21);
          frameRuntime.frameIndex++;
          const productionEventHeld = renderProductionEventProbe(21);
          frameRuntime.frameIndex++;
          const productionEventChanged = renderProductionEventProbe(22);
          const productionEventTokensPulse =
            productionEventBaseline[0] <= 2 &&
            productionEventFirst[0] >= 253 &&
            productionEventHeld[0] <= 2 &&
            productionEventChanged[0] >= 253;
          const multipassComparisonInput =
            createSharedFramebufferTarget(32, 16);
          resources.push(multipassComparisonInput);
          multipassComparisonInput.push();
          multipassComparisonInput.clear();
          multipassComparisonInput.noStroke();
          multipassComparisonInput.fill(0, 0, 0, 255);
          multipassComparisonInput.rect(0, 0, 32, 16);
          multipassComparisonInput.fill(255, 255, 255, 255);
          multipassComparisonInput.rect(10, 2, 12, 12);
          multipassComparisonInput.pop();
          const multipassComparisonRequest = {
            ...renderRequest,
            width: 32,
            height: 16,
            logicalWidth: 32,
            logicalHeight: 16,
          };
          const multipassComparisonInputPixels =
            pixelData(multipassComparisonInput);
          const multipassComparisonResults =
            multipassComparisons.map((comparison, index) => {
              const state = productionEffectRuntime.renderNodeState(
                `multipass-comparison-${comparison.id}`,
                {
                  buffer: multipassComparisonInput,
                  outputVersion: 1,
                  nodeKey: "multipass-comparison-input",
                  instanceInvariant: false,
                },
                {
                  id: `multipass-comparison-instance-${index}`,
                  componentId: comparison.id,
                  enabled: true,
                  opacity: 1,
                  blend: "normal",
                  params: {
                    amount: 1,
                    intensity: 1,
                    radius: 2,
                    bleedRadius: 2,
                  },
                },
                1,
                multipassComparisonRequest,
              );
              const pixels = pixelData(state.buffer);
              let changedRgb = 0;
              let litRgb = 0;
              for (let offset = 0; offset < pixels.length; offset += 4) {
                if (
                  pixels[offset] !== multipassComparisonInputPixels[offset] ||
                  pixels[offset + 1] !==
                    multipassComparisonInputPixels[offset + 1] ||
                  pixels[offset + 2] !==
                    multipassComparisonInputPixels[offset + 2]
                ) changedRgb++;
                if (
                  pixels[offset] > 10 ||
                  pixels[offset + 1] > 10 ||
                  pixels[offset + 2] > 10
                ) litRgb++;
              }
              const repeatedState = productionEffectRuntime.renderNodeState(
                `multipass-comparison-${comparison.id}`,
                {
                  buffer: multipassComparisonInput,
                  outputVersion: 1,
                  nodeKey: "multipass-comparison-input",
                  instanceInvariant: false,
                },
                {
                  id: `multipass-comparison-instance-${index}`,
                  componentId: comparison.id,
                  enabled: true,
                  opacity: 1,
                  blend: "normal",
                  params: {
                    amount: 1,
                    intensity: 0.75,
                    radius: 2,
                    bleedRadius: 2,
                  },
                },
                2,
                multipassComparisonRequest,
              );
              const repeatedPixels = pixelData(repeatedState.buffer);
              let repeatedChangedRgb = 0;
              let repeatedLitRgb = 0;
              for (let offset = 0; offset < repeatedPixels.length; offset += 4) {
                if (
                  repeatedPixels[offset] !==
                    multipassComparisonInputPixels[offset] ||
                  repeatedPixels[offset + 1] !==
                    multipassComparisonInputPixels[offset + 1] ||
                  repeatedPixels[offset + 2] !==
                    multipassComparisonInputPixels[offset + 2]
                ) repeatedChangedRgb++;
                if (
                  repeatedPixels[offset] > 10 ||
                  repeatedPixels[offset + 1] > 10 ||
                  repeatedPixels[offset + 2] > 10
                ) repeatedLitRgb++;
              }
              return {
                name: comparison.name,
                passes: comparison.isf.passes.length,
                changedRgb,
                litRgb,
                repeatedChangedRgb,
                repeatedLitRgb,
                visible:
                  changedRgb > 0 &&
                  litRgb > 0 &&
                  repeatedChangedRgb > 0 &&
                  repeatedLitRgb > 0,
              };
            });
          const multipassComparisonsVisible =
            multipassComparisonResults.every((entry) => entry.visible);

          const fftTarget = createSharedFramebufferTarget(32, 16);
          resources.push(fftTarget);
          const fftShader = builder.getShader({
            id: fftFilledWaveform.id,
            component: fftFilledWaveform,
          }, fftTarget);
          const fftColorShader = builder.getShader({
            id: fftColorLines.id,
            component: fftColorLines,
          }, fftTarget);
          const waveformDisplaceShader = builder.getShader({
            id: waveformDisplace.id,
            component: waveformDisplace,
          }, fftTarget);
          if (!fftShader || !fftColorShader || !waveformDisplaceShader) {
            throw new Error("AUDIO_ISF_SHADER_UNAVAILABLE");
          }
          const audioRenderRequest = {
            ...renderRequest,
            width: 32,
            height: 16,
            logicalWidth: 32,
            logicalHeight: 16,
          };
          const fftParams = {
            strokeSize: 0,
            gain: 3,
            minRange: 0,
            maxRange: 1,
            topColor: [0, 0, 0, 1],
            bottomColor: [0, 0.5, 0.9, 1],
            strokeColor: [0.25, 0.25, 0.25, 1],
          };
          const quietFft = runtime.renderProgram({
            component: fftFilledWaveform,
            shader: fftShader,
            finalTarget: fftTarget,
            renderRequest: audioRenderRequest,
            timeSeconds: 1,
            params: fftParams,
            instanceId: "fft-audio-smoke",
          });
          const quietFftPixel = sampledCenterPixel(quietFft);
          audioFrame.frequencyData.fill(255);
          audioFrame.sequence++;
          const loudFft = runtime.renderProgram({
            component: fftFilledWaveform,
            shader: fftShader,
            finalTarget: fftTarget,
            renderRequest: audioRenderRequest,
            timeSeconds: 1 + 1 / 60,
            params: fftParams,
            instanceId: "fft-audio-smoke",
          });
          const loudFftPixel = sampledCenterPixel(loudFft);
          const fftRespondsToAudio =
            quietFftPixel[2] <= 10 &&
            loudFftPixel[1] >= 90 &&
            loudFftPixel[2] >= 180;

          const eventTarget = createSharedFramebufferTarget(32, 16);
          resources.push(eventTarget);
          const shockwaveShader = builder.getShader({
            id: shockwavePulse.id,
            component: shockwavePulse,
          }, eventTarget);
          const fftSpectrogramShader = builder.getShader({
            id: fftSpectrogram.id,
            component: fftSpectrogram,
          }, eventTarget);
          if (!shockwaveShader || !fftSpectrogramShader) {
            throw new Error("EVENT_ISF_SHADER_UNAVAILABLE");
          }
          const eventRenderRequest = {
            ...renderRequest,
            width: 32,
            height: 16,
            logicalWidth: 32,
            logicalHeight: 16,
          };
          const shockwaveParams = {
            amount: 1,
            rate: 1,
            magnitude: 0.08,
            distortion: 10,
            center: [0.5, 0.5],
          };
          for (let frame = 0; frame < 12; frame++) {
            runtime.renderProgram({
              component: shockwavePulse,
              shader: shockwaveShader,
              input: multipassComparisonInput,
              finalTarget: eventTarget,
              renderRequest: eventRenderRequest,
              timeSeconds: frame / 60,
              params: shockwaveParams,
              instanceId: "shockwave-event-smoke",
              effectTransform: {},
            });
          }
          const shockwavePassKey = [
            shockwavePulse.id,
            shockwavePulse.isf.sourceHash,
            "shockwave-event-smoke",
            "lastTime",
          ].join(":");
          const shockwavePass = runtime.passTargets.get(shockwavePassKey);
          const lastWrittenTarget = (entry) =>
            entry.targets[entry.current === 0 ? 1 : 0];
          const shockwaveBeforePulse = sampledCenterPixel(
            lastWrittenTarget(shockwavePass),
          );
          frameRuntime.scheduledEvents = [{
            type: "isf-event",
            target: "shockwave-event-smoke",
            payload: { parameterId: "pulse" },
          }];
          runtime.renderProgram({
            component: shockwavePulse,
            shader: shockwaveShader,
            input: multipassComparisonInput,
            finalTarget: eventTarget,
            renderRequest: eventRenderRequest,
            timeSeconds: 12 / 60,
            params: shockwaveParams,
            instanceId: "shockwave-event-smoke",
            effectTransform: {},
          });
          const shockwaveDuringPulse = sampledCenterPixel(
            lastWrittenTarget(shockwavePass),
          );
          frameRuntime.scheduledEvents = [];
          runtime.renderProgram({
            component: shockwavePulse,
            shader: shockwaveShader,
            input: multipassComparisonInput,
            finalTarget: eventTarget,
            renderRequest: eventRenderRequest,
            timeSeconds: 13 / 60,
            params: shockwaveParams,
            instanceId: "shockwave-event-smoke",
            effectTransform: {},
          });
          const shockwaveAfterPulse = sampledCenterPixel(
            lastWrittenTarget(shockwavePass),
          );
          const shockwaveRenders = !!shockwavePass;

          const eventProbeShader = builder.getShader({
            id: eventProbe.id,
            component: eventProbe,
          }, eventTarget);
          if (!eventProbeShader) {
            throw new Error("EVENT_PROBE_SHADER_UNAVAILABLE");
          }
          const renderEventProbe = () => runtime.renderProgram({
            component: eventProbe,
            shader: eventProbeShader,
            finalTarget: eventTarget,
            renderRequest: eventRenderRequest,
            timeSeconds: 1,
            instanceId: "event-probe-smoke",
          });
          const eventProbeBefore = sampledCenterPixel(renderEventProbe());
          frameRuntime.scheduledEvents = [{
            type: "isf-event",
            target: "event-probe-smoke",
            payload: { parameterId: "trigger" },
          }];
          const eventProbeDuring = sampledCenterPixel(renderEventProbe());
          frameRuntime.scheduledEvents = [];
          const eventProbeAfter = sampledCenterPixel(renderEventProbe());
          const eventPulseIsTransient =
            eventProbeBefore[0] <= 2 &&
            eventProbeDuring[0] >= 253 &&
            eventProbeAfter[0] <= 2;
          const automatedEventBaseline = sampledCenterPixel(
            runtime.renderProgram({
              component: eventProbe,
              shader: eventProbeShader,
              finalTarget: eventTarget,
              renderRequest: eventRenderRequest,
              timeSeconds: 1,
              instanceId: "automated-event-probe",
            }),
          );
          frameRuntime.frameIndex++;
          const automatedEventFirst = sampledCenterPixel(
            runtime.renderProgram({
              component: eventProbe,
              shader: eventProbeShader,
              finalTarget: eventTarget,
              renderRequest: eventRenderRequest,
              timeSeconds: 1,
              params: { trigger: 7 },
              instanceId: "automated-event-probe",
            }),
          );
          frameRuntime.frameIndex++;
          const automatedEventHeld = sampledCenterPixel(
            runtime.renderProgram({
              component: eventProbe,
              shader: eventProbeShader,
              finalTarget: eventTarget,
              renderRequest: eventRenderRequest,
              timeSeconds: 1 + 1 / 60,
              params: { trigger: 7 },
              instanceId: "automated-event-probe",
            }),
          );
          frameRuntime.frameIndex++;
          const automatedEventChanged = sampledCenterPixel(
            runtime.renderProgram({
              component: eventProbe,
              shader: eventProbeShader,
              finalTarget: eventTarget,
              renderRequest: eventRenderRequest,
              timeSeconds: 1 + 2 / 60,
              params: { trigger: 8 },
              instanceId: "automated-event-probe",
            }),
          );
          const automatedEventTokensPulse =
            automatedEventBaseline[0] <= 2 &&
            automatedEventFirst[0] >= 253 &&
            automatedEventHeld[0] <= 2 &&
            automatedEventChanged[0] >= 253;

          frameRuntime.scheduledEvents = [{
            type: "isf-event",
            target: "fft-spectrogram-event-smoke",
            payload: { parameterId: "clear" },
          }];
          const clearedSpectrogram = runtime.renderProgram({
            component: fftSpectrogram,
            shader: fftSpectrogramShader,
            finalTarget: eventTarget,
            renderRequest: eventRenderRequest,
            timeSeconds: 1,
            params: {
              gain: 1,
              range: 1,
              axis_scale: 1.25,
              lumaMode: false,
              color1: [0, 0.5, 1, 1],
              color2: [1, 0, 0, 1],
              color3: [0, 1, 0, 1],
            },
            instanceId: "fft-spectrogram-event-smoke",
          });
          frameRuntime.scheduledEvents = [];
          const clearedSpectrogramPixel = sampledCenterPixel(clearedSpectrogram);
          const fftSpectrogramClearWorks =
            clearedSpectrogramPixel[0] <= 2 &&
            clearedSpectrogramPixel[1] <= 2 &&
            clearedSpectrogramPixel[2] <= 2;

          solid(input, [255, 0, 0, 255]);
          const redInputPixel = centerPixel(input);
          const first = runtime.renderProgram({
            component,
            shader,
            input,
            finalTarget,
            renderRequest,
            timeSeconds: 0,
            params: { amount: 1 },
            instanceId: "persistent-smoke",
            effectTransform: {},
          });
          const firstPixel = sampledCenterPixel(first);

          frameRuntime.frameIndex = 21;
          frameRuntime.visualTime = 1 / 60;
          solid(input, [0, 0, 255, 255]);
          const blueInputPixel = centerPixel(input);
          const second = runtime.renderProgram({
            component,
            shader,
            input,
            finalTarget,
            renderRequest,
            timeSeconds: 1 / 60,
            params: { amount: 1 },
            instanceId: "persistent-smoke",
            effectTransform: {},
          });
          const secondPixel = sampledCenterPixel(second);
          const firstIsRed =
            firstPixel[0] >= 245 && firstPixel[1] <= 10 &&
            firstPixel[2] <= 10 && firstPixel[3] >= 245;
          const secondRetainsHistory =
            secondPixel[0] >= 110 && secondPixel[0] <= 145 &&
            secondPixel[1] <= 10 &&
            secondPixel[2] >= 110 && secondPixel[2] <= 145 &&
            secondPixel[3] >= 245;
          const targets = runtime.passTargets.get(
            `${component.id}:${component.isf.sourceHash}:persistent-smoke:history`,
          );
          const ok =
            posterizeKeepsOrientation &&
            customVertexStageVisible &&
            cursorImportedImageVisible &&
            cursorOverlayImportedImageVisible &&
            randomFreezeFirstFrame.visible &&
            cometTailsFirstFrame.visible &&
            cometTailsPersistentHistoryVisible &&
            ghostingPassVisible &&
            ghostingDisplacesHighlights &&
            productionHandoffVisible &&
            productionGhostingVisible &&
            productionEventTokensPulse &&
            multipassComparisonsVisible &&
            fftRespondsToAudio &&
            shockwaveRenders &&
            eventPulseIsTransient &&
            automatedEventTokensPulse &&
            fftSpectrogramClearWorks &&
            firstIsRed &&
            secondRetainsHistory &&
            targets?.targets?.length === 2;
          resultElement.textContent = JSON.stringify({
            ok,
            posterizeTopPixel,
            posterizeBottomPixel,
            posterizeKeepsOrientation,
            customVertexStageVisible,
            cursorImportedImageVisible,
            cursorOverlayChangedPixels,
            cursorOverlayImportedImageVisible,
            randomFreezeFirstFrame,
            cometTailsFirstFrame,
            cometSecondTop,
            cometTailsPersistentHistoryVisible,
            ghostingIntermediatePixel,
            ghostingOutputPixels,
            ghostingPassVisible,
            ghostingDisplacesHighlights,
            productionHandoffTop,
            productionHandoffBottom,
            productionHandoffVisible,
            productionGhostingPixels,
            productionGhostingVisible,
            productionEventBaseline,
            productionEventFirst,
            productionEventHeld,
            productionEventChanged,
            productionEventTokensPulse,
            multipassComparisonResults,
            multipassComparisonsVisible,
            quietFftPixel,
            loudFftPixel,
            fftRespondsToAudio,
            shockwaveBeforePulse,
            shockwaveDuringPulse,
            shockwaveAfterPulse,
            shockwaveRenders,
            eventProbeBefore,
            eventProbeDuring,
            eventProbeAfter,
            eventPulseIsTransient,
            automatedEventBaseline,
            automatedEventFirst,
            automatedEventHeld,
            automatedEventChanged,
            automatedEventTokensPulse,
            clearedSpectrogramPixel,
            fftSpectrogramClearWorks,
            redInputPixel,
            blueInputPixel,
            firstPixel,
            secondPixel,
            firstIsRed,
            secondRetainsHistory,
            floatConstant: globalThis.FLOAT ?? null,
            pingPongTargets: targets?.targets?.length || 0,
          }, null, 2);
          document.documentElement.dataset.status = ok ? "ok" : "failed";
          runtime.dispose();
          productionIsfRuntime.dispose();
          productionEffectRuntime.dispose();
          builder.clear();
        } catch (error) {
          reportFailure(error?.stack || error?.message || String(error));
        } finally {
          for (const resource of resources) resource?.remove?.();
        }
      };

      new p5();
      }

      installSmoke().catch((error) => {
        reportFailure(error?.stack || error?.message || String(error));
      });
    </script>
  </body>
