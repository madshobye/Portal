<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>UI thumbnail catalog composition smoke</title>
  <link rel="stylesheet" href="../../js/libraries/ui-engine/base.css" />
  <link rel="stylesheet" href="../../js/libraries/ui-engine/themes/vj.css" />
  <style>
    :root { --section-inset: 6px; --panel: #323232; --control: #252525; }
    body { display: flex; gap: 12px; background: #101010; }
    .catalog-host { flex: 0 0 220px; width: 220px; height: 260px; min-height: 0; }
    #result { position: fixed; inset: auto 0 0 auto; }
  </style>
</head>
<body>
  <section id="direct" class="catalog-host"></section>
  <section id="nested" class="catalog-host"></section>
  <section id="adopted" class="catalog-host original-host-class"></section>
  <pre id="result">running</pre>
  <script type="module">
    import { createUi, createUiStateController } from "../../js/libraries/ui-engine/index.js";

    const items = Array.from({ length: 30 }, (_, index) => ({
      id: `item-${index}`,
      label: `Item ${index}`,
      labelIcon: "image",
      thumbnail: { fallback: "image", key: `item-${index}:` },
      actions: [{ id: "marker", label: "Marker", icon: "keep", variant: "marker-1" }],
    }));
    const collection = (id) => ({
      id,
      type: "collection",
      title: "Items",
      items,
      selectedId: "item-2",
      presentation: "rail-catalog",
      listPresentation: "thumbnail-grid",
      itemNode: "thumbnail-button",
      layout: { fill: true, grow: 1, shrink: 1, basis: 0, overflow: "hidden" },
    });
    const nestedModel = (id, integrateHost) => ({
      id,
      type: integrateHost ? "host-region" : "layout",
      orientation: "column",
      children: [collection("catalog")],
    });

    const state = createUiStateController();
    const directHost = document.querySelector("#direct");
    const nestedHost = document.querySelector("#nested");
    const adoptedHost = document.querySelector("#adopted");
    let directUi = createUi({ host: directHost, model: collection("direct-catalog"), state });
    let nestedUi = createUi({ host: nestedHost, model: nestedModel("nested-layout", false), state });
    let adoptedUi = createUi({ host: adoptedHost, model: nestedModel("adopted-layout", true), state });
    let lists = [...document.querySelectorAll('[data-ui-presentation="thumbnail-grid"]')];
    const before = lists.map((list) => list.querySelector('[data-ui-list-item="item-2"]'));
    directUi.update(collection("direct-catalog"));
    nestedUi.update(nestedModel("nested-layout", false));
    adoptedUi.update(nestedModel("adopted-layout", true));
    const after = lists.map((list) => list.querySelector('[data-ui-list-item="item-2"]'));
    for (const list of lists) {
      list.scrollTop = 120;
      list.dispatchEvent(new Event("scroll"));
    }
    await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    const writtenScrollTops = lists.map((list) => list.scrollTop);
    directUi.dispose();
    nestedUi.dispose();
    adoptedUi.dispose();
    directUi = createUi({ host: directHost, model: collection("direct-catalog"), state });
    nestedUi = createUi({ host: nestedHost, model: nestedModel("nested-layout", false), state });
    adoptedUi = createUi({ host: adoptedHost, model: nestedModel("adopted-layout", true), state });
    await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    lists = [...document.querySelectorAll('[data-ui-presentation="thumbnail-grid"]')];
    const result = {
      listCount: lists.length,
      scrollable: lists.every((list) => list.scrollHeight > list.clientHeight),
      retainedItems: before.every((item, index) => item === after[index]),
      selected: lists.every((list) => list.querySelector('[data-ui-list-item="item-2"]')?.getAttribute("aria-selected") === "true"),
      adoptedClassPreserved: adoptedHost.classList.contains("original-host-class"),
      equalWidths: new Set(lists.map((list) => Math.round(list.getBoundingClientRect().width))).size === 1,
      writtenScrollTops,
      restoredScrollTops: lists.map((list) => list.scrollTop),
      restoredScrollMaxima: lists.map((list) => list.scrollHeight - list.clientHeight),
      storedScroll: state.snapshot(),
      retainedScroll: lists.every((list, index) => (
        list.scrollTop === Math.min(writtenScrollTops[index], list.scrollHeight - list.clientHeight)
        && list.scrollTop > 0
      )),
    };
    result.ok = result.listCount === 3 && result.scrollable && result.retainedItems && result.selected && result.adoptedClassPreserved && result.equalWidths && result.retainedScroll;
    document.querySelector("#result").textContent = JSON.stringify(result, null, 2);
    document.documentElement.dataset.testStatus = result.ok ? "passed" : "failed";
  </script>
</body>
</html>
