<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UI Metrics Summary Smoke</title>
  <link rel="stylesheet" href="../../js/libraries/ui-engine/base.css">
  <link rel="stylesheet" href="../../js/libraries/ui-engine/themes/vj.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { display: grid; place-items: start center; padding: 32px; overflow: auto; font: 13px/1.3 Inter, ui-sans-serif, system-ui, sans-serif; }
    #popup { display: grid; width: min(500px, calc(100vw - 24px)); max-height: calc(100vh - 64px); grid-template-rows: minmax(0, 1fr) auto; gap: 10px; padding: 10px; border-radius: var(--radius-card); background: var(--panel); }
    #summary { min-height: 0; }
    #analyze { justify-content: center; background: var(--accent-strong); color: white; }
  </style>
</head>
<body>
  <main id="popup">
    <div id="summary"></div>
    <button id="analyze" type="button">Analyze 10 seconds</button>
  </main>
  <script type="module">
    import { MetricsSummaryNode } from "../../js/libraries/ui-engine/index.js";

    const thumbnail = "data:image/svg+xml," + encodeURIComponent(`<svg width="80" height="80"><rect width="80" height="80" fill="#050505"/><circle cx="40" cy="40" r="28" fill="#8a3d00"/><circle cx="40" cy="40" r="12" fill="#48a98e"/><circle cx="40" cy="40" r="4" fill="#050505"/></svg>`);
    const names = ["Comp 33", "Cellular Circles", "Eyeball Render", "Cellular Circles", "Alpha Vignette", "Media Resource to Image", "Alpha Vignette", "Eyeball Render"];
    const host = document.querySelector("#summary");
    const model = (tick = 0) => ({
      readouts: [
        { id: "overall", icon: "speed", label: "Overall", value: `${18 + tick % 2}%` },
        { id: "cpu", icon: "timer", label: "CPU", value: `${(2.9 + tick / 100).toFixed(1)} ms` },
        { id: "gpu", icon: "memory", label: "GPU", value: "2.8 ms" },
        { id: "output", icon: "open_in_new", label: "Output", value: "—" },
        { id: "cache", icon: "cached", label: "Cache reuse", value: "8" },
        { id: "renders", icon: "refresh", label: "Renders", value: "8" },
        { id: "signals", icon: "vital_signs", label: "Signal load", value: `${261 + tick}/s` },
      ],
      categoryTitle: "Signal flow per second",
      categoryNote: "Top: cacheHits:render-node 232 · previewPresentations:component 29",
      categories: [
        ["transactions", "Authored transactions", "0.0/s"], ["invalidations", "Render wakeups", "0.0/s"],
        ["compiles", "Graph compiles", "0.0/s"], ["resources", "Resource revisions", "0.0/s"],
        ["cache-invalidations", "Cache invalidations", "0.0/s"], ["cache-hits", "Cache hits", `${232 + tick}.0/s`],
        ["preview", "Preview presentations", "29.0/s"], ["output-presentations", "Output presentations", "0.0/s"],
      ].map(([id, label, value]) => ({ id, label, value })),
      hotspots: names.map((name, index) => ({
        id: `hotspot-${index}`,
        label: name,
        detail: index ? "source / generator · preview" : "component · preview",
        value: `${Math.max(0.1, 1.9 - index * 0.27 + tick / 100).toFixed(1)} ms`,
        share: `${Math.max(1, 57 - index * 8)}%`,
        media: { src: thumbnail },
        action: { id: "edit", label: `Edit ${name}`, icon: "edit", iconOnly: true, payload: { index } },
      })),
      emptyText: "Waiting for an active renderer sample…",
    });
    const instance = MetricsSummaryNode.moduleExports.createUiInstance({ host, inputs: model(), document, emit() {} });
    instance.mount();
    const initialReadout = host.querySelector(".ui-node-metric-readout");
    const initialHotspot = host.querySelector(".ui-node-metric-hotspot");
    const hotspotList = host.querySelector(".ui-node-metrics-hotspots");
    hotspotList.scrollTop = 24;
    instance.update(model(1));
    const smoke = {
      retainedReadout: initialReadout === host.querySelector(".ui-node-metric-readout"),
      retainedHotspot: initialHotspot === host.querySelector(".ui-node-metric-hotspot"),
      retainedScroll: hotspotList.scrollTop === 24,
      compactActions: [...host.querySelectorAll(".ui-node-metric-hotspot-action")].every((button) => button.children.length === 1 && button.getAttribute("aria-label")),
      popupHeight: document.querySelector("#popup").getBoundingClientRect().height,
      viewportHeight: innerHeight,
    };
    document.querySelector("#popup").dataset.smoke = JSON.stringify(smoke);
    hotspotList.scrollTop = 0;
  </script>
</body>
</html>
