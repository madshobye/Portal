<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VJ1 Output Clean Reload</title>
    <style>
      body { margin: 0; background: #08090b; color: #eef2ef; font: 13px/1.4 ui-monospace, monospace; }
      main { padding: 16px; }
      iframe { width: 640px; height: 360px; border: 1px solid #30343a; }
      pre { white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <main>
      <iframe id="output" title="Output under clean-reload test"></iframe>
      <pre id="results">initializing...</pre>
    </main>
    <script type="module">
      const frame = document.querySelector("#output");
      const result = document.querySelector("#results");
      const reloads = Math.max(2, Math.min(10, Number(new URL(location.href).searchParams.get("reloads")) || 3));
      const samples = [];

      try {
        for (let iteration = 1; iteration <= reloads; iteration++) {
          result.textContent = `loading output ${iteration}/${reloads}...`;
          frame.src = `../../?output=1&fixture=tests/fixtures/four-surface-show.json&cleanReload=${iteration}`;
          await once(frame, "load", 15000);
          const sample = await waitForOwnedPresentation(frame, 15000);
          assertCleanCanvasSet(sample, iteration);
          samples.push(sample);
        }
        const report = { ok: true, reloads, samples };
        result.textContent = JSON.stringify(report, null, 2);
        document.documentElement.dataset.status = "ok";
      } catch (error) {
        result.textContent = JSON.stringify({ ok: false, error: error?.stack || String(error), samples }, null, 2);
        document.documentElement.dataset.status = "error";
      }

      function once(target, eventName, timeoutMs) {
        return new Promise((resolve, reject) => {
          const timeout = setTimeout(() => reject(new Error(`CLEAN_RELOAD_TIMEOUT:${eventName}`)), timeoutMs);
          target.addEventListener(eventName, () => {
            clearTimeout(timeout);
            resolve();
          }, { once: true });
        });
      }

      async function waitForOwnedPresentation(target, timeoutMs) {
        const deadline = performance.now() + timeoutMs;
        while (performance.now() < deadline) {
          const document = target.contentDocument;
          const canvases = Array.from(document?.querySelectorAll?.("canvas") || [], (canvas) => ({
            id: String(canvas.id || ""),
            owner: String(canvas.dataset.vj1CanvasOwner || ""),
            kind: String(canvas.dataset.vj1CanvasKind || ""),
            width: Number(canvas.width) || 0,
            height: Number(canvas.height) || 0,
          }));
          if (canvases.some((canvas) => canvas.kind === "presentation")) return canvases;
          await new Promise((resolve) => setTimeout(resolve, 50));
        }
        throw new Error("CLEAN_RELOAD_PRESENTATION_TIMEOUT");
      }

      function assertCleanCanvasSet(canvases, iteration) {
        const presentations = canvases.filter((canvas) => canvas.kind === "presentation");
        const fullResolution = canvases.filter((canvas) => canvas.width > 1 && canvas.height > 1);
        const ids = canvases.map((canvas) => canvas.id).filter(Boolean);
        if (presentations.length !== 1) throw new Error(`CLEAN_RELOAD_PRESENTATION_COUNT:${iteration}:${presentations.length}`);
        if (fullResolution.length !== 1) throw new Error(`CLEAN_RELOAD_FULL_RESOLUTION_COUNT:${iteration}:${fullResolution.length}`);
        if (canvases.some((canvas) => !canvas.owner)) throw new Error(`CLEAN_RELOAD_UNOWNED_CANVAS:${iteration}`);
        if (new Set(ids).size !== ids.length) throw new Error(`CLEAN_RELOAD_DUPLICATE_ID:${iteration}`);
      }
    </script>
  </body>
</html>
