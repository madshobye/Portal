<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VJ1 Shader Smoke</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@2.2.0/lib/p5.js"></script>
    <style>
      body {
        margin: 0;
        background: #08090b;
        color: #eef2ef;
        font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      pre {
        margin: 16px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <pre id="result">running...</pre>
    <script type="module">
      import { getShaderComponent } from "../js/shaders/shader-registry.js?v=noise-field-1";
      import { getGeneratorShaderComponent } from "../js/shaders/generator-shaders.js?v=shadertoy-generator-16";
      import { createShaderBuilder } from "../js/shaders/shader-builder.js?v=shadertoy-generator-16";

      const effects = ["photoGrade", "labelThresholdGrain", "smear", "alphaVignette", "glitchDistort", "spinRotate", "echoFade", "mirrorFold", "heatShimmer", "crayonStroke", "pixelArtUpscale"];
      const generators = ["gradient", "fireflies", "eyeball", "swayingTrees", "terrainFlyover", "bezierStrokes", "shadertoyBaseWarp", "seascape", "paintDrips", "cloudyTunnel", "cherenkovVolume", "biomineLite"];
      const result = document.getElementById("result");

      new p5((sketch) => {
        sketch.setup = () => {
          const target = sketch.createGraphics(128, 72, sketch.WEBGL);
          const statuses = [];
          const builder = createShaderBuilder({
            getCustomCode: () => "",
            onStatus: (status, error) => statuses.push({ status, error }),
          });
          const effectResults = effects.map((id) => {
            const component = getShaderComponent(id);
            const shader = builder.getShader({ id, component }, target);
            return { id, found: !!component, compiled: !!shader, name: component?.name || "" };
          });
          const generatorResults = generators.map((id) => {
            const component = getGeneratorShaderComponent(id);
            const shader = builder.getShader({ id: component?.id || id, component }, target);
            let rendered = false;
            let renderError = "";
            if (shader) {
              try {
                target.push();
                target.clear();
                target.shader(shader);
                if (component.type === "shadertoy") {
                  const gl = target?._renderer?.GL || target?.drawingContext;
                  shader.setUniform("iResolution", [gl?.drawingBufferWidth || target.width, gl?.drawingBufferHeight || target.height, 1]);
                  shader.setUniform("iTime", 1);
                } else {
                  shader.setUniform("resolution", [target.width, target.height]);
                  shader.setUniform("time", 1);
                }
                target.rect(-target.width / 2, -target.height / 2, target.width, target.height);
                target.resetShader();
                target.pop();
                rendered = true;
              } catch (error) {
                renderError = error?.message || String(error);
              }
            }
            return { id, found: !!component, compiled: !!shader, rendered, renderError, name: component?.name || "" };
          });
          const ok = effectResults.every((item) => item.found && item.compiled) &&
            generatorResults.every((item) => item.found && item.compiled && item.rendered);
          const payload = { ok, effectResults, generatorResults, statuses };
          document.body.dataset.status = ok ? "ok" : "failed";
          result.textContent = JSON.stringify(payload, null, 2);
          target.remove?.();
          sketch.noLoop();
        };
      });
    </script>
  </body>
</html>
