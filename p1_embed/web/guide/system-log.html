<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Log - XOBIT Guide</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="site.css?v=guide-style-4">
  </head>
  <body data-guide-section="system-log">

    <main>
      <section class="page-hero panel">
        <p class="eyebrow">Change log</p>
        <h1>Change log</h1>
        <p class="lead">Short notes about updates you may notice in the browser, guide, firmware, or board behavior.</p>
      </section>

      <section>
        <h2>Latest Changes</h2>
        <div class="log-tools" data-log-tools hidden>
          <label class="log-search">
            <span class="material-symbols-rounded" aria-hidden="true">search</span>
            <input type="search" data-log-search placeholder="Search changes">
          </label>
        </div>
        <div class="log-list" data-log-list>
          <article class="log-entry">
            <p>Loading change log...</p>
          </article>
        </div>
      </section>
    </main>
    <script src="site.js?v=guide-shell-10"></script>
  </body>
</html>
